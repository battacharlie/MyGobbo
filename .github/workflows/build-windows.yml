name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --foreground-scripts
      - name: Check NDI module
        shell: bash
        run: |
          ls node_modules/@stagetimerio/grandiose/dist || true
          node -e "const g=require('@stagetimerio/grandiose'); console.log('NDI OK', typeof g.version === 'function' ? g.version() : '')"
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: igor-abits-windows
          path: |
            dist/*.exe
      # Su main pubblica una Release vX.Y.Z (versione di package.json) se
      # non esiste ancora: basta alzare la versione per pubblicarne una nuova.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "La release $TAG esiste già"
          else
            # Note scritte a mano in release-notes/vX.Y.Z.md, se ci sono.
            NOTES="release-notes/$TAG.md"
            if [ -f "$NOTES" ]; then NOTES_ARG=(--notes-file "$NOTES"); else NOTES_ARG=(--generate-notes); fi
            gh release create "$TAG" dist/*.exe --target "$GITHUB_SHA" --title "IGOR - ABit/s $TAG" "${NOTES_ARG[@]}"
          fi
