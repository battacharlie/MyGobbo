name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --foreground-scripts
      - name: Check NDI module
        shell: bash
        run: |
          ls node_modules/@stagetimerio/grandiose/dist || true
          node -e "const g=require('@stagetimerio/grandiose'); console.log('NDI OK', typeof g.version === 'function' ? g.version() : '')"
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: mio-countdown-windows
          path: |
            dist/*.exe
