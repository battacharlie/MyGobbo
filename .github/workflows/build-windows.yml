name: Build Windows

on:
  push:
    branches: [main]
    # Un tag vX.Y.Z (es. v0.3.0) pubblica anche una Release scaricabile.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --foreground-scripts
      - name: Check NDI module
        shell: bash
        run: |
          ls node_modules/@stagetimerio/grandiose/dist || true
          node -e "const g=require('@stagetimerio/grandiose'); console.log('NDI OK', typeof g.version === 'function' ? g.version() : '')"
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: igor-abits-windows
          path: |
            dist/*.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.exe --title "IGOR - ABit/s $GITHUB_REF_NAME" --generate-notes
