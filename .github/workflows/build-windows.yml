name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --foreground-scripts
      - name: Check NDI module
        shell: bash
        run: |
          ls node_modules/@stagetimerio/grandiose/dist || true
          node -e "const g=require('@stagetimerio/grandiose'); console.log('NDI OK', typeof g.version === 'function' ? g.version() : '')"
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: igor-abits-windows
          path: |
            dist/*.exe
      - name: Pubblica la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
