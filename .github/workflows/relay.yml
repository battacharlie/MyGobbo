# Mette online il ponte per il telecomando da internet (cartella relay/)
# su Cloudflare Workers. Si avvia a mano da Actions → Relay → Run workflow.
# Servono i segreti del repository CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID.
name: Relay
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
