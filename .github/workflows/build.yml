name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --foreground-scripts
      - name: Check NDI module
        shell: bash
        run: |
          ls node_modules/@stagetimerio/grandiose/dist || true
          node -e "const g=require('@stagetimerio/grandiose'); console.log('NDI OK', typeof g.version === 'function' ? g.version() : '')"
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: igor-abits-windows
          path: |
            dist/*.exe

  # Mac: una versione per i processori Apple (M1, M2…) e una per Intel.
  # Il modulo NDI è nativo, quindi ognuna si costruisce sul suo tipo di Mac.
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --foreground-scripts
      - name: Check NDI module
        run: |
          ls node_modules/@stagetimerio/grandiose/dist || true
          node -e "const g=require('@stagetimerio/grandiose'); console.log('NDI OK', typeof g.version === 'function' ? g.version() : '')"
      - run: npm run dist:mac -- --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Check signature
        run: codesign --verify --deep --verbose=2 dist/mac*/*.app
      - uses: actions/upload-artifact@v4
        with:
          name: igor-abits-mac-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip

  # Su main pubblica una Release vX.Y.Z (versione di package.json) se
  # non esiste ancora: basta alzare la versione per pubblicarne una nuova.
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l out
          TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "La release $TAG esiste già"
          else
            # Note scritte a mano in release-notes/vX.Y.Z.md, se ci sono.
            NOTES="release-notes/$TAG.md"
            if [ -f "$NOTES" ]; then NOTES_ARG=(--notes-file "$NOTES"); else NOTES_ARG=(--generate-notes); fi
            gh release create "$TAG" out/*.exe out/*.dmg out/*.zip --target "$GITHUB_SHA" --title "IGOR - ABit/s $TAG" "${NOTES_ARG[@]}"
          fi
