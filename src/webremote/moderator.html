<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#15171c">
<title>IGOR - ABit/s</title>
<style>
  :root { --blue: #16508a; --grey: #c1c1c1; --bg: #15171c; --card: #1f232b; --line: #343946; --text: #e8eaf0; --muted: #9aa1b0; --green: #22a35a; --red: #d93a3a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 0 14px calc(20px + env(safe-area-inset-bottom)); }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; align-items: center; gap: 10px; padding: 14px 0 12px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 19px; margin: 0; flex: 1; }
  header h1 small { color: var(--muted); font-weight: 400; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--green); flex: none; }
  .dot.off { background: var(--red); }
  #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-top: 14px; }
  .card { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .card.air { border-color: var(--red); }
  .head { display: flex; align-items: center; gap: 10px; }
  .head .name { flex: 1; min-width: 0; font-weight: 600; font-size: 19px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .head .name small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
  .badge { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 5px 9px; border-radius: 7px; background: #2a2f3a; color: var(--muted); white-space: nowrap; }
  .badge.air { background: var(--red); color: #fff; }
  .time { font: 700 64px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-align: center; padding: 10px 0; font-variant-numeric: tabular-nums; }
  .text { color: var(--muted); font-size: 15px; white-space: pre-wrap; max-height: 5.5em; overflow: hidden; }
  .row { display: flex; gap: 10px; }
  button { flex: 1; font: inherit; font-weight: 600; color: var(--text); background: #2a2f3a; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 54px; cursor: pointer; }
  button:active { transform: scale(.97); }
  button.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
  .notice { margin: 12px 0; padding: 10px; border-radius: 10px; background: #3a1f22; color: #ffd7d7; display: none; }
  .notice.show { display: block; }
</style>
</head>
<body>
<header><span class="dot" id="dot"></span><h1>IGOR <small id="title"></small></h1></header>
<div class="notice" id="lost"></div>
<div id="list"></div>
<script>
// Pagina moderatore: solo gli input scelti dalla regia, con pochi comandi.
(function () {
  var base = location.pathname.replace(/\/$/, '');
  var S = null, L = {}, sig = '', fails = 0, got = 0;
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function send(cmd) {
    fetch(base + '/cmd', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cmd) })
      .then(function () { poll(); }).catch(function () {});
  }
  function btn(text, cls, cmd) { var b = el('button', cls, text); b.title = text; b.onclick = function () { send(cmd); }; return b; }
  function pad(n) { return String(n).padStart(2, '0'); }
  // Come nella regia: MM:SS, H:MM:SS oltre l'ora, + oltre la scadenza.
  function fmt(ms, up) {
    var neg = ms < 0, abs = Math.abs(ms) / 1000;
    var total = neg || up ? Math.floor(abs) : Math.ceil(abs);
    var h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
    return (neg && total > 0 ? '+' : '') + (h > 0 ? h + ':' + pad(m) + ':' + pad(s) : pad(m) + ':' + pad(s));
  }
  function timerNow(tm) {
    if (tm.clock) return { text: tm.clock, color: '' };
    var d = tm.running ? Date.now() - got : 0;
    var ms = tm.up ? tm.ms + d : tm.ms - d;
    var remaining = tm.up ? tm.durationSec * 1000 - ms : ms;
    var color = tm.color;
    if (!(tm.up && !(tm.durationSec > 0))) {
      if (remaining <= 0) color = tm.endColor;
      else if (remaining <= tm.warningSec * 1000) color = tm.warningColor;
    }
    return { text: fmt(ms, tm.up), color: color };
  }
  function tick() {
    if (!S) return;
    S.items.forEach(function (it) {
      var t = it.timer && document.querySelector('[data-time="' + it.id + '"]');
      if (!t) return;
      var v = timerNow(it.timer);
      t.textContent = v.text; t.style.color = v.color;
    });
  }
  function card(it) {
    var c = el('div', 'card' + (it.onAir ? ' air' : ''));
    var head = el('div', 'head');
    var name = el('div', 'name', it.name);
    var sub = [it.typeLabel !== it.name ? it.typeLabel : '', it.scene || ''].filter(Boolean).join(' · ');
    if (sub) name.appendChild(el('small', null, sub));
    head.appendChild(name);
    head.appendChild(el('span', 'badge' + (it.onAir ? ' air' : ''), it.onAir ? L.onAir : L.off));
    c.appendChild(head);
    if (it.timer) {
      var t = el('div', 'time'); t.setAttribute('data-time', it.id); c.appendChild(t);
    }
    if (it.text) c.appendChild(el('div', 'text', it.text));
    var row = el('div', 'row');
    row.appendChild(btn(it.visible ? L.hide : L.show, it.visible ? 'on' : '', { type: 'visible', id: it.id, on: !it.visible }));
    c.appendChild(row);
    if (it.type === 'timer') {
      var r2 = el('div', 'row');
      var run = it.timer.running;
      r2.appendChild(btn(run ? L.pause : L.start, run ? 'on' : '', { type: 'timer', id: it.id, action: run ? 'pause' : 'start' }));
      r2.appendChild(btn(L.reset, '', { type: 'timer', id: it.id, action: 'reset' }));
      c.appendChild(r2);
    } else if (it.type === 'prompter') {
      var r3 = el('div', 'row');
      r3.appendChild(btn(it.running ? L.pause : L.start, it.running ? 'on' : '', { type: 'prompter', id: it.id, action: it.running ? 'pause' : 'start' }));
      r3.appendChild(btn(L.top, '', { type: 'prompter', id: it.id, action: 'top' }));
      c.appendChild(r3);
    }
    return c;
  }
  function render() {
    L = S.labels || {};
    document.documentElement.lang = S.lang || 'it';
    document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
    $('title').textContent = L.title || '';
    // Il tempo dei timer cambia sempre: si ridisegna solo se cambia il resto.
    var s = JSON.stringify(S.items.map(function (it) { var x = Object.assign({}, it); if (x.timer) x.timer = { running: x.timer.running, clock: !!x.timer.clock }; return x; })) + JSON.stringify(L);
    if (s !== sig) {
      sig = s;
      var list = $('list');
      list.innerHTML = '';
      if (!S.items.length) list.appendChild(el('div', 'empty', L.empty));
      S.items.forEach(function (it) { list.appendChild(card(it)); });
    }
    tick();
  }
  function poll() {
    fetch(base + '/state', { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function (data) {
      S = data; got = Date.now(); fails = 0;
      $('dot').className = 'dot'; $('lost').className = 'notice';
      render();
    }).catch(function () {
      if (++fails >= 2) { $('dot').className = 'dot off'; $('lost').textContent = L.lost || '…'; $('lost').className = 'notice show'; }
    });
  }
  poll();
  setInterval(poll, 800);
  setInterval(tick, 200);
})();
</script>
</body>
</html>
