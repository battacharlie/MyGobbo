<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Mio Countdown – Regia</title>
  <link rel="stylesheet" href="control.css">
</head>
<body>
  <header class="topbar">
    <strong>Mio Countdown</strong>
    <label>Uscita <select id="sel-display"></select></label>
    <label>Sfondo <input type="color" id="col-background"></label>
    <button id="btn-toggle-display">Mostra/nascondi uscita</button>
    <span id="output-info" class="muted"></span>
  </header>

  <div class="layout">
    <div class="left">
      <div id="preview-wrap">
        <div id="preview">
          <div id="stage"></div>
          <div id="overlay"></div>
        </div>
      </div>
      <p class="muted small">Anteprima dell'uscita: trascina un elemento per spostarlo, l'angolo in basso a destra per ridimensionarlo (Maiusc mantiene le proporzioni). Gli elementi nascosti sono semitrasparenti.</p>

      <div class="add-row">
        <span>Aggiungi:</span>
        <button data-add="ndi">+ Segnale NDI</button>
        <button data-add="capture">+ Periferica di acquisizione</button>
        <button data-add="timer">+ Timer</button>
        <button data-add="ticker">+ Frase</button>
      </div>

      <div class="list-head">
        <h2>Elementi (dal primo piano allo sfondo)</h2>
        <button id="btn-show-all" class="small-btn">Mostra tutti</button>
      </div>
      <ul id="layer-list"></ul>
    </div>

    <aside id="panel" class="right"></aside>
  </div>

  <script src="../shared/layers.js"></script>
  <script src="../shared/render.js"></script>
  <script src="control.js"></script>
</body>
</html>
