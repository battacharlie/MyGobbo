<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Mio Countdown – Controllo</title>
  <link rel="stylesheet" href="control.css">
</head>
<body>
  <header>
    <div id="preview">
      <div id="p-title"></div>
      <div id="p-time">10:00</div>
      <div id="p-status">Fermo</div>
    </div>
    <div class="transport">
      <button id="btn-start" class="primary">▶ Avvia</button>
      <button id="btn-reset">↺ Azzera</button>
      <div class="adjust">
        <button data-adjust="-60">−1 min</button>
        <button data-adjust="-10">−10 s</button>
        <button data-adjust="10">+10 s</button>
        <button data-adjust="60">+1 min</button>
      </div>
      <p class="hint">Barra spaziatrice: avvia/pausa · R: azzera</p>
    </div>
  </header>

  <section>
    <h2>Durata</h2>
    <div class="row">
      <label>Minuti <input id="in-min" type="number" min="0" max="999" value="10"></label>
      <label>Secondi <input id="in-sec" type="number" min="0" max="59" value="0"></label>
      <button id="btn-set">Imposta</button>
    </div>
    <div class="row presets" id="presets"></div>
  </section>

  <section>
    <h2>Testi sul secondo monitor</h2>
    <label class="block">
      <span><input type="checkbox" id="chk-title"> Titolo (sopra il countdown)</span>
      <input id="in-title" type="text" placeholder="Es. Pausa caffè">
    </label>
    <label class="block">
      <span><input type="checkbox" id="chk-message"> Messaggio (sotto il countdown)</span>
      <textarea id="in-message" rows="2" placeholder="Es. Si riprende alle 11:00"></textarea>
    </label>
    <label class="block">
      <span>Testo a tempo scaduto</span>
      <input id="in-end" type="text" placeholder="Es. TEMPO SCADUTO">
    </label>
    <p class="hint">I testi si aggiornano sullo schermo mentre scrivi.</p>
  </section>

  <section>
    <h2>Opzioni</h2>
    <div class="row">
      <label>Avviso colorato negli ultimi <input id="in-warn" type="number" min="0" max="3600" value="60"> secondi</label>
    </div>
    <div class="row">
      <label><input type="checkbox" id="chk-overtime"> Dopo lo zero continua a contare in negativo</label>
    </div>
    <div class="row colors">
      <label>Sfondo <input type="color" id="col-background"></label>
      <label>Testo <input type="color" id="col-text"></label>
      <label>Avviso <input type="color" id="col-warning"></label>
      <label>Scaduto <input type="color" id="col-end"></label>
    </div>
    <div class="row">
      <label>Monitor del countdown <select id="sel-display"></select></label>
      <button id="btn-toggle-display">Mostra/nascondi schermo</button>
    </div>
  </section>

  <script src="../format.js"></script>
  <script src="control.js"></script>
</body>
</html>
